apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: putout-editor
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/coderaiser/putout-editor
    targetRevision: master
    path: deploy/k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: putout-editor
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
