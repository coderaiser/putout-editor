apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: putout-editor
  namespace: putout-editor
spec:
  ingressClassName: traefik
  rules:
    - host: putout-editor.cloudcmd.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: putout-editor
                port:
                  number: 80
