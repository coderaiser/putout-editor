name: Release
on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-test:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - name: Install kubectl via palabra
        run: |
          bun i -g palabra
          palabra i k3d kubectl
      - name: Create k3d cluster
        run: |
          k3d cluster create ci-test \
            --wait \
            --port "8080:80@loadbalancer"
      - name: Verify cluster context
        run: |
          kubectl config use-context k3d-ci-test
          kubectl config current-context
          kubectl cluster-info
          kubectl get nodes
      - name: Set image tag
        run: |
          sed -i "s|ghcr.io/coderaiser/putout-editor:.*|ghcr.io/coderaiser/putout-editor:${GITHUB_REF_NAME}|" deploy/k8s/deployment.yaml
      - name: Apply manifests
        run: kubectl apply -f deploy/k8s/
      - name: Wait for rollout
        run: kubectl -n putout-editor rollout status deployment/putout-editor --timeout=120s
      - name: Smoke test
        run: |
          curl --fail --retry 8 --retry-delay 5 -H "Host: putout-editor.localhost" http://localhost:8080
      - name: Dump state on failure
        if: failure()
        run: |
          kubectl -n putout-editor get pods
          kubectl -n putout-editor describe pods
          kubectl -n putout-editor logs -l app=putout-editor --all-containers