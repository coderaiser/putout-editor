name: Release
on:
  push:
    tags:
      - "*"
permissions:
  contents: write
  packages: write
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy-test:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: |
          bun i -g palabra
          palabra i k3d kubectl kustomize
      - name: Create k3d cluster
        run: |
          k3d cluster create ci-test \
            --wait \
            --port "8080:80@loadbalancer"
      - name: Verify cluster context
        run: |
          kubectl config use-context k3d-ci-test
          kubectl config current-context
          kubectl cluster-info
          kubectl get nodes
      - name: Set image tag
        working-directory: deploy/k8s/overlays/ci
        run: |
          TAG=${GITHUB_REF_NAME#v}
          kustomize edit set image ghcr.io/coderaiser/putout-editor=ghcr.io/coderaiser/putout-editor:${TAG}
      - name: Apply manifests
        run: kubectl apply -k deploy/k8s/overlays/ci
      - name: Wait for rollout
        run: kubectl -n putout-editor rollout status deployment/putout-editor --timeout=120s
      - name: Smoke test
        run: |
          curl --fail --retry 20 --retry-delay 5 --retry-all-errors \
            -o /tmp/smoke.html \
            -H "Host: putout-editor.cloudcmd.io" \
            http://localhost:8080
          echo ${GITHUB_REF_NAME}
          cat /tmp/smoke.html
          grep -q "Putout Editor ${GITHUB_REF_NAME}" /tmp/smoke.html
      - name: Dump state on failure
        if: failure()
        run: |
          kubectl -n putout-editor get pods
          kubectl -n putout-editor describe pods
          kubectl -n putout-editor logs -l app=putout-editor --all-containers
  deploy-prod:
    runs-on: ubuntu-latest
    needs: deploy-test
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: master
      - name: Bump image tag in deploy manifests
        working-directory: deploy/k8s/overlays/prod
        run: |
          TAG=${GITHUB_REF_NAME#v}
          kustomize edit set image \
            ghcr.io/coderaiser/putout-editor=ghcr.io/coderaiser/putout-editor:${TAG}
      - name: Commit and push tag bump
        uses: EndBug/add-and-commit@v10
        continue-on-error: true
        with:
          message: "chore: actions: deploy ${{ github.ref_name }} 🌿"
