name: Node CI
permissions:
  contents: write
on:
  - push
  - pull_request
jobs:
  build:
    if: "!startsWith(github.event.head_commit.message, 'chore: deploy')"
    runs-on: ubuntu-latest
    env:
      NAME: putout-editor
    strategy:
      matrix:
        node-version:
          - 22.x
          - 24.x
          - 26.x
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          no-cache: true
          bun-version: latest
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install globals
        run: |
          bun i playwright redrun madrun palabra -fg --no-save
          palabra i kubeconform
      - name: Install dependencies
        run: bun i -f --no-save
      - name: Init Madrun
        run: madrun --init
      - name: Typecheck
        run: redrun test:dts
      - name: Lint
        run: redrun fix:lint
      - name: Lint Kubernetes
        run: |
          kubeconform -summary -strict -ignore-missing-schemas deploy/k8s/
          kubectl kustomize ./deploy/k8s/base
      - name: Typos
        uses: coderaiser/typos.ai@v1.1.8
        with:
          key: ${{ secrets.TYPOS_AI_KEY }}
      - name: Commit fixes
        uses: EndBug/add-and-commit@v10
        continue-on-error: true
        with:
          message: "chore: ${{ env.NAME }}: actions: lint ☘️"
      - name: Coverage
        run: redrun coverage report
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('**/package.json') }}
      - name: Install Playwright browsers
        run: playwright install --with-deps chromium webkit
        working-directory: packages/client
      - name: Build for e2e
        run: redrun build
        working-directory: packages/client
      - name: E2E tests
        run: redrun test:e2e
        working-directory: packages/client
      - name: Upload visual snapshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-snapshots
          path: |
            packages/client/e2e/snapshots/
            packages/client/e2e/test-results/
          retention-days: 14
      - name: Coveralls
        uses: coverallsapp/github-action@v2
        continue-on-error: true
        with:
          base-path: ./packages/client
          github-token: ${{ secrets.GITHUB_TOKEN }}
