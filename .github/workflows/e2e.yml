name: E2E
permissions:
  contents: write
on:
  - push
  - pull_request
jobs:
  e2e:
    if: "!startsWith(github.event.head_commit.message, 'chore: deploy')"
    runs-on: ubuntu-latest
    env:
      NAME: putout-editor
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          no-cache: true
          bun-version: latest
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - name: Install globals
        run: bun i playwright redrun madrun -fg --no-save
      - name: Install dependencies
        run: bun i -f --no-save
      - name: Init Madrun
        run: madrun --init
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright browsers and deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit
        working-directory: packages/client
      - name: Install Playwright system deps only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit
        working-directory: packages/client
      - name: Build for e2e
        run: redrun build
        working-directory: packages/client
      - name: Build chat for e2e
        run: bun run build
        working-directory: packages/chat
      - name: E2E tests
        run: redrun test:e2e
        working-directory: packages/client
      # `packages/chat`'s e2e is its own step and not another `redrun`
      # invocation. `redrun` collects from the cwd and every *parent*
      # (`parentDirectories` in `redrun/bin/redrun.js`), never a sibling, so the
      # step above collects the root's and the client's and chat's is never run -
      # a green `E2E` badge that says nothing about the chat page at all.
      #
      # `bun run`, not `redrun`: `bun run` puts `node_modules/.bin` on `PATH` and
      # `redrun` does not reliably, which is the trap in
      # `docs/memory/workspaces.md`. `playwright` is only on that PATH through it.
      - name: Chat e2e
        run: bun run test:e2e
        working-directory: packages/chat
      - name: Upload test results on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-test-results
          path: |
            packages/client/test-results/
            packages/chat/test-results/
          retention-days: 14
